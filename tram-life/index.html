<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>TRAM LIFE — In da Krivoy Rog</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;z-index:2;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#101820d9;border:1px solid #ffffff30;border-radius:12px;padding:10px 13px}.small{font-size:12px;color:#c5cbd0}#controls{position:fixed;z-index:3;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}#stick{width:112px;height:112px;border:2px solid #ffffff70;background:#ffffff20;border-radius:50%;position:relative;touch-action:none}#knob{position:absolute;width:44px;height:44px;left:32px;top:32px;border-radius:50%;background:#ffffffa8}.buttons{display:flex;gap:8px}button{border:1px solid #ffffff55;border-radius:12px;padding:12px 15px;background:#17242ee8;color:white;font-weight:700;min-height:48px}#loader{position:fixed;z-index:5;inset:0;background:#080e14;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:24px;border:1px solid #ffffff30;border-radius:20px;background:linear-gradient(145deg,#24323d,#101820)}.brand{font-size:25px;font-weight:900}.brand span{display:block;color:#e0b68e;font-size:15px}.bar{height:9px;border-radius:9px;background:#3b454d;margin:20px 0 9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#922d2b,#e5b27f);transition:width .25s}.hint{position:fixed;z-index:2;bottom:145px;left:50%;transform:translateX(-50%);background:#101820d9;border-radius:10px;padding:8px 12px;white-space:nowrap;font-size:13px}@media(max-height:560px){#stick{width:86px;height:86px}#knob{left:20px;top:20px}}
</style></head><body>
<div class="hud"><div class="pill"><b>TRAM LIFE</b><div class="small">КРИВОЙ РОГ • МАРШРУТ 1</div></div><div class="pill small" id="station">СТАНЦИЯ: МЕТАЛЛУРГОВ</div></div>
<div class="hint" id="hint">Джойстик — движение • свайп — обзор</div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="buttons"><button id="ride">ЕХАТЬ</button><button id="run">БЕГ</button></div></div>
<div id="loader"><div class="card"><div class="brand">TRAM LIFE<span>In da Krivoy Rog</span></div><p id="status">Загрузка 3D-сцены…</p><div class="bar"><div class="fill" id="fill"></div></div><b id="pct">0%</b><p class="small">Подготавливаем станцию и трамвай. Для первого запуска нужен интернет.</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x18232c);scene.fog=new THREE.Fog(0x18232c,25,100);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);camera.position.set(0,1.7,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbac9d4,0x29221c,2));const light=new THREE.DirectionalLight(0xffdfb1,2.2);light.position.set(-5,12,8);light.castShadow=true;scene.add(light);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,100),mat(0x77766f));floor.rotation.x=-Math.PI/2;floor.position.z=-28;floor.receiveShadow=true;scene.add(floor);
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
box(-7,3,-28,1,6,100,0x4c5355);box(7,3,-28,1,6,100,0x4c5355);box(0,6,-28,14,1,100,0x343b40);
for(let z=15;z>-75;z-=8){box(-4.5,2.5,z,.35,5,.5,0x66645d);box(4.5,2.5,z,.35,5,.5,0x66645d);const lamp=new THREE.PointLight(0xffdca0,18,13);lamp.position.set(0,5,z);scene.add(lamp)}
for(const x of [-.8,.8]){const rail=box(x,.12,-28,.12,.18,100,0x25292b);rail.material.metalness=.7}
for(let z=12;z>-70;z-=2){box(-.8,.02,z,.22,.05,.12,0x5a5146);box(.8,.02,z,.22,.05,.12,0x5a5146)}
// platform edge + tiled columns
box(-3.1,.12,-28,.12,.22,100,0xd1ae59);box(3.1,.12,-28,.12,.22,100,0xd1ae59);
for(let z=10;z>-60;z-=12){box(-3.9,1.7,z,.5,3.4,.55,0x8b8980);box(3.9,1.7,z,.5,3.4,.55,0x8b8980)}
// tram model assembled from geometry
const tram=new THREE.Group();scene.add(tram);tram.position.set(0,0,-15);
const body=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.6,8),mat(0x9b2928));body.position.y=1.7;body.castShadow=true;tram.add(body);
const roof=new THREE.Mesh(new THREE.BoxGeometry(2.55,.22,7.8),mat(0xb8b0a2));roof.position.y=3.02;tram.add(roof);
for(let z=-3;z<=3;z+=1.5){const win=new THREE.Mesh(new THREE.BoxGeometry(2.63,.85,1.15),mat(0x253f4b,.3));win.position.set(0,2.15,z);tram.add(win)}
for(const x of [-.8,.8])for(const z of [-2.5,2.5]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.18,16),mat(0x16191b));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.55,z);tram.add(wheel)}
box(0,.01,-28,.08,.04,100,0x17191b);
const sign=box(-3.7,2.9,-5,2.6,1.1,.15,0x263b43);const signText=document.createElement('canvas');signText.width=512;signText.height=128;const c=signText.getContext('2d');c.fillStyle='#263b43';c.fillRect(0,0,512,128);c.fillStyle='white';c.font='bold 48px sans-serif';c.fillText('МЕТАЛЛУРГОВ',22,80);const tex=new THREE.CanvasTexture(signText);sign.material=new THREE.MeshBasicMaterial({map:tex});
let joy={x:0,y:0},running=false,driving=false,yaw=0,pitch=0,lastX=0,lastY=0,drag=false;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
function moveJoy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,42/l);joy={x:dx/42*k,y:dy/42*k};knob.style.left=32+dx*k+'px';knob.style.top=32+dy*k+'px'}
stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveJoy(e)};stick.onpointermove=e=>{if(e.buttons)moveJoy(e)};stick.onpointerup=stick.onpointercancel=()=>{joy={x:0,y:0};knob.style.left='32px';knob.style.top='32px'};
document.querySelector('#run').onpointerdown=()=>running=true;document.querySelector('#run').onpointerup=document.querySelector('#run').onpointerleave=()=>running=false;
document.querySelector('#ride').onclick=()=>{driving=!driving;document.querySelector('#ride').textContent=driving?'ВЫЙТИ':'ЕХАТЬ';document.querySelector('#hint').textContent=driving?'Вы за рулём трамвая':'Вы вышли из кабины'};
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY};addEventListener('pointerup',()=>drag=false);renderer.domElement.onpointermove=e=>{if(drag){yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-.8,Math.min(.8,pitch-(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}};
let loaded=0;const status=document.querySelector('#status'),fill=document.querySelector('#fill'),pct=document.querySelector('#pct');function progress(n,t){loaded=n;fill.style.width=n+'%';pct.textContent=n+'%';status.textContent=t}
progress(35,'Создаём станцию «Металлургов»…');setTimeout(()=>progress(70,'Собираем трамвай…'),250);setTimeout(()=>progress(100,'Сцена готова'),550);setTimeout(()=>document.querySelector('#loader').remove(),1000);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!driving){const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));const speed=(running?5:2.5)*dt;camera.position.addScaledVector(forward,-joy.y*speed);camera.position.addScaledVector(right,joy.x*speed);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-5.5,5.5);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-72,14)}else{tram.position.z-=dt*4;camera.position.set(tram.position.x,3.5,tram.position.z+1.2);yaw=0}camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
